name: Zaiko Stock Monitor

on:
  schedule:
    # 12:05 AM Japan Standard Time (UTC+9). Japan does not observe DST,
    # so this stays at 00:05 JST all year.
    - cron: "5 15 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Site key to check (blank = all)"
        required: false
        default: ""
      mode:
        description: "normal = alert as usual | seed = record stock silently | dry-run = check and push nothing"
        required: false
        default: normal
        type: choice
        options: [normal, seed, dry-run]

# Needed so the job can commit state.json back to the repo.
permissions:
  contents: write

# A manual run while the scheduled one is in flight would otherwise race
# on the state commit.
concurrency:
  group: zaiko-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Hard stop. Without this a hung job can burn up to 6 hours of the
    # monthly Actions allowance in a single run.
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Zaiko
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          # Passed through the environment rather than interpolated into the
          # script: `site` is free text, and this step holds the secrets.
          SITE: ${{ inputs.site }}
          MODE: ${{ inputs.mode }}
        run: |
          ARGS=""
          [ -n "$SITE" ] && ARGS="$ARGS --site $SITE"
          [ "$MODE" = "seed" ] && ARGS="$ARGS --seed"
          [ "$MODE" = "dry-run" ] && ARGS="$ARGS --dry-run"
          echo "Running: python run.py$ARGS"
          python run.py $ARGS

      # always(): a run that alarms on one site may still have good state for
      # the other, and run.py only advances state it trusts.
      - name: Persist state
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "State unchanged - nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update stock state [skip ci]"

          # A human commit landing on main between checkout and push would
          # otherwise reject this, losing the state update — which makes the
          # next run re-send every alert from this one.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on origin/main."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "Could not push the state update after 3 attempts."
          exit 1
