name: Zaiko Stock Monitor

on:
  schedule:
    # 12:05 AM Japan Standard Time (UTC+9). Japan does not observe DST,
    # so this stays at 00:05 JST all year.
    - cron: "5 15 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Site key to check (blank = all)"
        required: false
        default: ""
      mode:
        description: "normal = alert as usual | seed = record stock silently | dry-run = check and push nothing"
        required: false
        default: normal
        type: choice
        options: [normal, seed, dry-run]

# Needed so the job can commit state.json back to the repo.
permissions:
  contents: write

# A manual run while the scheduled one is in flight would otherwise race
# on the state commit.
concurrency:
  group: zaiko-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Hard stop. Without this a hung job can burn up to 6 hours of the
    # monthly Actions allowance in a single run.
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Zaiko
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ inputs.site }}" ] && ARGS="$ARGS --site ${{ inputs.site }}"
          [ "${{ inputs.mode }}" = "seed" ] && ARGS="$ARGS --seed"
          [ "${{ inputs.mode }}" = "dry-run" ] && ARGS="$ARGS --dry-run"
          echo "Running: python run.py$ARGS"
          python run.py $ARGS

      - name: Persist state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update stock state [skip ci]"
            git push
          else
            echo "State unchanged - nothing to commit."
          fi
