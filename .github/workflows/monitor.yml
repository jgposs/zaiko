name: COMOLI Size Monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:           # lets you trigger manually from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: comoli_state.json
          key: comoli-state-${{ github.run_id }}
          restore-keys: |
            comoli-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run monitor
        env:
          COMOLI_EMAIL_SENDER:    ${{ secrets.COMOLI_EMAIL_SENDER }}
          COMOLI_EMAIL_PASSWORD:  ${{ secrets.COMOLI_EMAIL_PASSWORD }}
          COMOLI_EMAIL_RECIPIENT: ${{ secrets.COMOLI_EMAIL_RECIPIENT }}
        run: |
          python - <<'EOF'
          import os, re, pathlib

          src = pathlib.Path("comoli_monitor.py").read_text()
          overrides = {
              'EMAIL_SENDER':    os.environ.get("COMOLI_EMAIL_SENDER", ""),
              'EMAIL_PASSWORD':  os.environ.get("COMOLI_EMAIL_PASSWORD", ""),
              'EMAIL_RECIPIENT': os.environ.get("COMOLI_EMAIL_RECIPIENT", ""),
          }
          for key, val in overrides.items():
              src = re.sub(rf'^{key}\s*=\s*".*?"', f'{key} = "{val}"', src, flags=re.MULTILINE)

          exec(compile(src, "comoli_monitor.py", "exec"))
          EOF

      - name: Save state
        if: always()
        uses: actions/cache@v4
        with:
          path: comoli_state.json
          key: comoli-state-${{ github.run_id }}
